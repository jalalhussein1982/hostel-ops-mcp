# Demo authorization server for hostel-ops-mcp: Keycloak in dev mode with the `hostel`
# realm imported from keycloak/realm-hostel.json (three users, nine scopes, one public
# PKCE client for the MCP Inspector). Nothing here is needed to run the tests.
#
#   docker compose up -d
#   open http://127.0.0.1:8080/admin  (admin / admin)
#   OAUTH_ISSUER_URL=http://127.0.0.1:8080/realms/hostel \
#   RESOURCE_SERVER_URL=http://127.0.0.1:8000/mcp \
#   uv run python -m hostel_ops_mcp.server --http
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 12
