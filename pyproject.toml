[project]
name = "hostel-ops-mcp"
version = "0.1.0"
description = "MCP server over the hostel check-in system: Streamable HTTP, OAuth 2.1 scopes, safe write tools, confirmed erasure, PII redaction by scope"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pydantic>=2.0",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.28",
    # Runtime dependencies of the vendored hostel app (vendor/hostel-checkin-system/requirements.txt).
    # The app has no pyproject, so it is a git submodule and its imports resolve through these.
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "passlib[argon2]>=1.7.4",
    "itsdangerous>=2.2",
    "tzdata>=2024.2",
    "cryptography>=42",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "segno>=1.6",
]

[project.scripts]
hostel-ops-mcp = "hostel_ops_mcp.server:main"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # passlib imports the stdlib `crypt` module (deprecated in 3.12) and reads argon2.__version__.
    "ignore::DeprecationWarning:passlib",
    "ignore:.*'crypt' is deprecated.*:DeprecationWarning",
    "ignore:.*argon2.__version__.*:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hostel_ops_mcp"]
